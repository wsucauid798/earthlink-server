name: Publish + deploy

# Push to a release branch -> build linux/amd64 image, push to GHCR
# (auto-linked to this repo via the org.opencontainers.image.source label
# baked into the Dockerfile), then SSH to the production VPS and trigger
# `systemctl restart earthlink-stack` so the running stack picks up the
# new image (the unit's ExecStartPre does `docker compose pull`).
#
# Implements: dev-tools D25 (build + push) and D28 (auto-deploy).
#
# Required GitHub repo secrets:
#   VPS_HOST     -> 77.68.50.14
#   VPS_USER     -> wsawyerr
#   VPS_SSH_KEY  -> contents of ~/.ssh/id_earthlink_ci (private key)
#
# Required VPS-side setup (once):
#   - Public key of id_earthlink_ci appended to /home/wsawyerr/.ssh/authorized_keys
#   - /etc/sudoers.d/earthlink-deploy with:
#       wsawyerr ALL=(ALL) NOPASSWD: /bin/systemctl restart earthlink-stack

on:
  push:
    branches:
      - main
      - master
      - 'release/**'
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:  # allow manual run from the Actions tab

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false   # let in-flight builds finish; safer for image tags

permissions:
  contents: read
  packages: write             # required to push to ghcr.io

jobs:

  # ------------------------------------------------------------------
  # Build the linux/amd64 image and push to GHCR
  # ------------------------------------------------------------------
  build:
    name: Build + push image to GHCR
    runs-on: ubuntu-latest

    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
      image_tag_sha: sha-${{ steps.meta.outputs.short_sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute short SHA + build timestamp
        id: meta
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push (linux/amd64)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/earthlink-server:latest
            ghcr.io/${{ github.repository_owner }}/earthlink-server:sha-${{ steps.meta.outputs.short_sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------
  # Trigger the systemd unit on the VPS so it picks up the new image
  # ------------------------------------------------------------------
  deploy:
    name: Deploy (systemctl restart on VPS)
    runs-on: ubuntu-latest
    needs: build
    # Skip on PR builds (which run with reduced permissions and won't have secrets)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: SSH + restart earthlink-stack.service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Strict host key checking — populate VPS_SSH_HOST_KEY secret
          # to enable. Default leaves it off; configure once stable.
          # known_hosts: ${{ secrets.VPS_SSH_HOST_KEY }}
          script: |
            set -euo pipefail
            echo "Restarting earthlink-stack.service (pulls newest image, then up -d)"
            sudo /bin/systemctl restart earthlink-stack
            # Brief settle window, then status
            sleep 5
            systemctl status earthlink-stack --no-pager | head -20
            echo
            echo "Deployed image digest: ${{ needs.build.outputs.image_digest }}"
            echo "Deployed tag:          ${{ needs.build.outputs.image_tag_sha }}"
