services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: earthlink
      POSTGRES_PASSWORD: earthlink
      POSTGRES_DB: earthlink
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U earthlink"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  chroma:
    image: chromadb/chroma:1.5.0
    ports:
      - "8001:8000"
    volumes:
      - chromadata:/data
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /data
      ANONYMIZED_TELEMETRY: "FALSE"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8000'"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    image: earthlink-server
    build: .
    container_name: server-1
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          memory: 8g
        reservations:
          memory: 4g
    environment:
      EARTHLINK_DB_HOST: db
      EARTHLINK_DB_PORT: 5432
      EARTHLINK_DB_USER: earthlink
      EARTHLINK_DB_PASSWORD: earthlink
      EARTHLINK_DB_NAME: earthlink
      EARTHLINK_REDIS_URL: redis://redis:6379/0
      EARTHLINK_CHROMA_HOST: chroma
      EARTHLINK_CHROMA_PORT: 8000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
    volumes:
      - app-data:/app/data

volumes:
  pgdata:
  redisdata:
  chromadata:
  app-data:
