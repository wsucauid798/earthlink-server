services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: earthlink
      POSTGRES_PASSWORD: earthlink
      POSTGRES_DB: earthlink
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U earthlink"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  chroma:
    image: chromadb/chroma:1.5.0
    ports:
      - "8001:8000"
    volumes:
      - chromadata:/data
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /data
      ANONYMIZED_TELEMETRY: "FALSE"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8000'"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    image: earthlink-server
    build: .
    container_name: server-1
    ports:
      - "8000:8000"
      - "4433:4433/udp"
    deploy:
      resources:
        reservations:
          memory: 4g
    environment:
      EARTHLINK_DB_HOST: db
      EARTHLINK_DB_PORT: 5432
      EARTHLINK_DB_USER: earthlink
      EARTHLINK_DB_PASSWORD: earthlink
      EARTHLINK_DB_NAME: earthlink
      EARTHLINK_REDIS_URL: redis://redis:6379/0
      EARTHLINK_CHROMA_HOST: chroma
      EARTHLINK_CHROMA_PORT: 8000
      EARTHLINK_WT_HOST: ${EARTHLINK_WT_HOST:-0.0.0.0}
      EARTHLINK_WT_PORT: ${EARTHLINK_WT_PORT:-4433}
      EARTHLINK_WT_PATH: ${EARTHLINK_WT_PATH:-/wt/world}
      EARTHLINK_WT_CERT_PATH: ${EARTHLINK_WT_CERT_PATH:-/certs/dev-cert.pem}
      EARTHLINK_WT_KEY_PATH: ${EARTHLINK_WT_KEY_PATH:-/certs/dev-key.pem}
      EARTHLINK_WT_PUBLIC_URL: ${EARTHLINK_WT_PUBLIC_URL:-https://wt.localhost/wt/world}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
    volumes:
      - app-data:/app/data
      - ./src:/app/src  # Dev: mount source for hot reload without rebuild
      - ./certs:/certs:ro

volumes:
  pgdata:
  redisdata:
  chromadata:
  app-data:
