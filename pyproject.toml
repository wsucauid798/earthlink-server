[project]
name = "earthlink-server"
version = "0.0.2"
description = "A symbolic virtual world server — built from real Earth data"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "websockets>=13.0",
    "redis>=5.0.0",
    "chromadb-client>=1.0.0",
    "ray>=2.40.0",
    "sentence-transformers>=3.0.0",
    "numpy>=1.26.0",
    "tzdata>=2024.1",
    "timezonefinder>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/world", "src/db", "src/api", "src/data_acquisition", "src/agents", "src/adapters"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
